<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <main class="container" data-testid="test-contact-page">
      <h1>Contact Us</h1>
      <form id="contactForm" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            data-testid="test-contact-name"
            required
          />
          <span
            id="errorName"
            data-testid="test-contact-error-name"
            class="error-msg"
          ></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            data-testid="test-contact-email"
            required
          />
          <span
            id="errorEmail"
            data-testid="test-contact-error-email"
            class="error-msg"
          ></span>
        </div>

        <!-- Subject -->
        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            data-testid="test-contact-subject"
            required
          />
          <span
            id="errorSubject"
            data-testid="test-contact-error-subject"
            class="error-msg"
          ></span>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            data-testid="test-contact-message"
            required
          ></textarea>
          <span
            id="errorMessage"
            data-testid="test-contact-error-message"
            class="error-msg"
          ></span>
        </div>

        <button type="submit" data-testid="test-contact-submit">Send</button>
        <p
          id="successMsg"
          data-testid="test-contact-success"
          class="success-msg"
        ></p>
      </form>
    </main>

    <script src="js/contact.js"></script>
  </body>
</html>
